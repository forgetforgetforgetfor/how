<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000; color: white; font-family: Arial, sans-serif;
    height: 100vh; display: flex; justify-content: center;
    align-items: center; overflow: hidden;
}
.container { text-align: center; }
h2 {
    font-size: 20px; font-weight: normal;
    letter-spacing: 5px; margin-bottom: 25px;
}
input {
    background: transparent; border: 1px solid #333; color: white;
    padding: 13px; outline: none; text-align: center;
    letter-spacing: 4px; width: 230px;
}
input:focus { border-color: white; }
button {
    display: block; margin: 15px auto; padding: 10px 30px;
    background: transparent; color: white; border: 1px solid #333;
    cursor: pointer; letter-spacing: 3px;
}
button:hover { background: white; color: black; }
</style>
</head>
<body>
<div class="container" id="login">
    <h2>ENTER PASSWORD</h2>
    <form id="entryForm">
        <input type="text" id="password" placeholder="PASSWORD"
            autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">ENTER</button>
    </form>
</div>

<audio id="bgMusic" src="background.mp3" loop preload="auto"></audio>

<script>
const destinations = {
    frk: "https://www.youtube.com/@frkdr",
    hxtxn: "https://www.youtube.com/@hxtxn",
    kuraf: "https://www.youtube.com/@Kurafindux",
    anormal: "https://deltarune.com/man/",
    mystery: "https://deltarune.com/sighting/",
    frenzy: "https://deltarune.com/icee/"
};

const form = document.getElementById("entryForm");
const input = document.getElementById("password");
const music = document.getElementById("bgMusic");

music.loop = true;
music.volume = 1;

// Attempt autoplay on page load. Browsers may block audible autoplay.
function startMusic() {
    if (!music.paused) return;
    const attempt = music.play();
    if (attempt && typeof attempt.catch === "function") {
        attempt.catch(() => {
            // Browser autoplay policy may require a user interaction.
        });
    }
}
window.addEventListener("load", startMusic);

// Retry after the first visitor interaction if autoplay was blocked.
document.addEventListener("pointerdown", startMusic, { once: true });
document.addEventListener("keydown", startMusic, { once: true });

form.addEventListener("submit", function(event) {
    event.preventDefault();
    const typed = input.value.trim().toLowerCase();

    if (typed === "frar") {
        window.location.href =
            "https://drive.google.com/file/d/1K7qN4dm2WYmShw3F7b1vODODuIH8_aw6/view?usp=sharing";
        return;
    }

    if (Object.prototype.hasOwnProperty.call(destinations, typed.toLowerCase())) {
        window.location.href = destinations[typed.toLowerCase()];
        return;
    }

    window.close();
    setTimeout(() => window.location.replace("about:blank"), 150);
});
</script>
</body>
</html>
