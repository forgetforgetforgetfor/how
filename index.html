<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #e8e8e8;
    font-family: "Courier New", monospace;
}
body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
}
.login {
    width: min(90vw, 390px);
    text-align: center;
    position: relative;
}
.topline {
    color: #777;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 18px;
}
h1 {
    margin: 0 0 28px;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 7px;
    text-shadow: 0 0 12px #aaa;
}
.prompt {
    color: #777;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}
form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}
input {
    width: 100%;
    padding: 15px 12px;
    border: 1px solid #555;
    border-radius: 0;
    outline: none;
    background: #050505;
    color: #fff;
    text-align: center;
    font: inherit;
    font-size: 15px;
    letter-spacing: 4px;
    caret-color: #fff;
    box-shadow: 0 0 14px #ffffff0b, inset 0 0 12px #ffffff08;
}
input:focus {
    border-color: #bbb;
    box-shadow: 0 0 18px #ffffff22, inset 0 0 12px #ffffff0d;
}
button {
    min-width: 145px;
    padding: 12px 25px;
    border: 1px solid #666;
    background: #080808;
    color: #fff;
    font: inherit;
    letter-spacing: 4px;
    cursor: pointer;
    transition: .15s;
}
button:hover {
    background: #eee;
    color: #000;
    box-shadow: 0 0 22px #fff5;
}
.hint {
    margin-top: 22px;
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
}
#forget {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
    background: #000;
    isolation: isolate;
}
#forget::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        #ffffff0b 1px,
        transparent 3px,
        transparent 5px
    );
    animation: scan 7s linear infinite;
}
#forget::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 25%, #000 100%);
}
#forgetWords {
    position: absolute;
    inset: -5%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
    grid-auto-rows: minmax(55px, 1fr);
    align-items: center;
    justify-items: center;
    gap: 2px;
    color: #f4f4f4;
    font-size: clamp(18px, 3.4vw, 48px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 7px #fff, 0 0 20px #aaa;
    animation: pulse .8s steps(2, end) infinite;
}
#forgetWords span {
    animation: jitter calc(.12s + (var(--n) * .013s)) steps(2, end) infinite alternate;
}
.alert {
    position: absolute;
    z-index: 6;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: clamp(11px, 2vw, 16px);
    letter-spacing: 5px;
    animation: blink .45s steps(2, end) infinite;
}
.systemline {
    position: absolute;
    z-index: 6;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #888;
    font-size: 10px;
    letter-spacing: 2px;
}
@keyframes pulse {
    0%, 100% { opacity: .72; transform: translate(0); }
    50% { opacity: 1; transform: translate(1px, -1px); }
}
@keyframes jitter {
    0% { transform: translate(0,0) skew(0); }
    25% { transform: translate(2px,-1px) skew(2deg); }
    50% { transform: translate(-2px,1px) skew(-2deg); }
    75% { transform: translate(1px,2px) skew(1deg); }
    100% { transform: translate(-1px,-2px) skew(-1deg); }
}
@keyframes blink {
    0%, 45% { opacity: 1; }
    46%, 100% { opacity: .25; }
}
@keyframes scan {
    from { transform: translateY(-15px); }
    to { transform: translateY(15px); }
}
</style>
</head>
<body>

<main class="login" id="login">
    <div class="topline">REMOTE ACCESS TERMINAL // NODE 07</div>
    <h1>IDENTIFICATION</h1>
    <div class="prompt">ENTER ACCESS KEY TO CONTINUE</div>
    <form id="entryForm">
        <input
            id="entry"
            type="text"
            placeholder="TYPE ACCESS KEY"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Enter password"
        >
        <button type="submit">[ ENTER ]</button>
    </form>
    <div class="hint">UNAUTHORIZED ACCESS WILL BE TERMINATED</div>
</main>

<section id="forget" aria-live="assertive">
    <div class="alert">!!! SYSTEM OVERRIDE DETECTED !!!</div>
    <div id="forgetWords"></div>
    <div class="systemline">MEMORY PURGE // CONNECTION LOST // FORGET</div>
</section>

<audio id="bgMusic" src="background.mp3" loop preload="auto"></audio>

<script>
const destination =
    "https://drive.google.com/file/d/1K7qN4dm2WYmShw3F7b1vODODuIH8_aw6/view?usp=sharing";

const triggerWords = [
    "mystery", "anormal", "frenzy", "frk", "hxtxn", "kuraf"
];

const form = document.getElementById("entryForm");
const entry = document.getElementById("entry");
const music = document.getElementById("bgMusic");
let forgetActivated = false;

// Attempt autoplay as soon as the page loads.
// Some browsers block audible autoplay until the visitor interacts.
function attemptAutoplay() {
    music.loop = true;
    music.volume = 1;
    const playback = music.play();
    if (playback && typeof playback.catch === "function") {
        playback.catch(() => {
            // Browser autoplay policy may require a user gesture.
        });
    }
}
document.addEventListener("DOMContentLoaded", attemptAutoplay);
window.addEventListener("load", attemptAutoplay);

function activateForget() {
    if (forgetActivated) return;
    forgetActivated = true;

    // Stop the soundtrack immediately when a trigger word is detected.
    music.pause();
    music.currentTime = 0;

    document.getElementById("login").style.display = "none";
    const screen = document.getElementById("forget");
    const words = document.getElementById("forgetWords");
    screen.style.display = "block";

    for (let i = 0; i < 180; i++) {
        const span = document.createElement("span");
        span.textContent = "FORGET";
        span.style.setProperty("--n", i % 9);
        words.appendChild(span);
    }
}

// Trigger immediately while the visitor types, without pressing Enter.
entry.addEventListener("input", function() {
    const typed = entry.value.toLowerCase();
    if (triggerWords.some(word => typed.includes(word))) {
        activateForget();
    }
});

form.addEventListener("submit", function(event) {
    event.preventDefault();
    if (forgetActivated) return;

    const typed = entry.value.trim().toLowerCase();

    if (triggerWords.some(word => typed.includes(word))) {
        activateForget();
        return;
    }

    if (typed === "frar") {
        window.location.href = destination;
        return;
    }

    // Browsers may block closing a tab that was not opened by script.
    window.close();
    setTimeout(() => window.location.replace("about:blank"), 150);
});
</script>
</body>
</html>
