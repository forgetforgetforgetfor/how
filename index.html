<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}
body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
}
.login {
    width: min(90vw, 360px);
    text-align: center;
}
h1 {
    margin: 0 0 26px;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 5px;
}
form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}
input {
    width: 100%;
    padding: 14px 12px;
    border: 1px solid #444;
    border-radius: 0;
    outline: none;
    background: #050505;
    color: #fff;
    text-align: center;
    font: inherit;
    letter-spacing: 3px;
}
input:focus { border-color: #aaa; }
button {
    min-width: 130px;
    padding: 11px 24px;
    border: 1px solid #444;
    border-radius: 0;
    background: transparent;
    color: #fff;
    font: inherit;
    letter-spacing: 3px;
    cursor: pointer;
}
button:hover {
    background: #fff;
    color: #000;
}
#forget {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
    background: #000;
}
#forgetWords {
    position: absolute;
    inset: -2%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
    grid-auto-rows: minmax(55px, 1fr);
    align-items: center;
    justify-items: center;
    gap: 4px;
    color: #fff;
    font-size: clamp(18px, 3.3vw, 46px);
    font-weight: 800;
    letter-spacing: 3px;
    overflow: hidden;
}
</style>
</head>
<body>

<main class="login" id="login">
    <h1>ENTER PASSWORD</h1>
    <form id="entryForm">
        <input
            id="entry"
            type="text"
            placeholder="TYPE HERE"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Enter password or trigger word"
        >
        <button type="submit">ENTER</button>
    </form>
</main>

<section id="forget" aria-live="polite">
    <div id="forgetWords"></div>
</section>

<audio id="bgMusic" src="background.mp3" loop preload="auto"></audio>

<script>
const destination =
    "https://drive.google.com/file/d/1K7qN4dm2WYmShw3F7b1vODODuIH8_aw6/view?usp=sharing";

const triggerWords = [
    "mystery",
    "anormal",
    "frenzy",
    "frk",
    "hxtxn",
    "kuraf"
];

const form = document.getElementById("entryForm");
const entry = document.getElementById("entry");
const music = document.getElementById("bgMusic");
let forgetActivated = false;

function startMusic() {
    if (music.paused) {
        music.play().catch(() => {
            // Most browsers require a user interaction before allowing audio.
        });
    }
}

// Try autoplay; if the browser blocks it, the first click or keypress starts it.
window.addEventListener("load", startMusic);
document.addEventListener("pointerdown", startMusic, { once: true });
document.addEventListener("keydown", startMusic, { once: true });

function activateForget() {
    if (forgetActivated) return;
    forgetActivated = true;

    document.getElementById("login").style.display = "none";
    const screen = document.getElementById("forget");
    const words = document.getElementById("forgetWords");

    screen.style.display = "block";

    for (let i = 0; i < 180; i++) {
        const span = document.createElement("span");
        span.textContent = "FORGET";
        words.appendChild(span);
    }

    startMusic();
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const typed = entry.value.trim().toLowerCase();

    // Trigger words take priority over the password.
    if (triggerWords.some(word => typed.includes(word))) {
        activateForget();
        return;
    }

    if (typed === "frar") {
        window.location.href = destination;
        return;
    }

    // Browsers may block window.close() for tabs not opened by script.
    window.close();
    setTimeout(() => {
        window.location.replace("about:blank");
    }, 150);
});
</script>
</body>
</html>
